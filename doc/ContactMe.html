<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Me</title>
</head>
<body>
<h1>Contact Me</h1>
   <iframe width="315"  height="560" src="https://www.youtube.com/embed/t0ZVZRNYSw0" title="Video"> </iframe>


    <form name="feedback">
        <p>  Name: <input  type="text" name="fname" placeholder="anonymous" required> </p>
        <p> Last Name: <input  type="text" name="lname" placeholder="anonymous" required> </p>

        <p> E-mail <input type="email" name="mail" placeholder="name@domain.com" required></p>


        <p></p>
       <!-- Radio Buttons--> 
        <p>Do you recomend this Website?</p>
        <input type="radio" name="recomend" value="yes"> Yes
        <input type="radio" name="recomend" value="no"> No
<br>
<!-- range-->
      <p> Rate the Website from 1 to 10 <input type="range" name="rating" min="1" max="10"> </p> 


      <p>What is your favorite website?</p>
        <select name="website">
    <option value="Google">Google</option>
    <option value="Facebook">Facebook</option>
    <option value="Twitter">Twitter</option>
    <option value="Twitch">Twitch</option>
    </select>

    <!--Aditional form elements-->
    <p>Todays date: <input type="date" name="date"></p>

    <p>What is your favorite color? <input type="color" name="FavColor"></p>

    <p>Phone Number:<input type="tel" name="phone" placeholder="803-756-7590" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"> </p>

    <!--Aditional coments-->
     <p>Additional Comments:</p>
    <p> <textarea name="comments" rows="5" cols="25"></textarea> </p>

    <input type="submit" name="submit" id="submit">
    </form>




</body>
</html>
